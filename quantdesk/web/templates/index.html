<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuantDesk</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>QuantDesk</h1>
  <nav>
    <button class="tab active" data-tab="dashboard">لوحة الأسعار</button>
    <button class="tab" data-tab="backtest">مُختبر الاستراتيجيات</button>
    <button class="tab" data-tab="screener">المُصفّي</button>
  </nav>
</header>

<main>
  <section id="tab-dashboard" class="panel">
    <div class="controls">
      <select id="market">
        <option value="crypto">عملات رقمية</option>
        <option value="stocks">أسهم</option>
      </select>
      <input id="symbol" value="BTCUSDT" placeholder="الرمز (مثل BTCUSDT أو AAPL)">
      <button id="load-btn">تحميل</button>
      <span id="market-status"></span>
    </div>
    <div class="stats" id="stats"></div>
    <canvas id="candles" width="1000" height="380"></canvas>
  </section>

  <section id="tab-backtest" class="panel hidden">
    <div class="controls">
      <select id="bt-market">
        <option value="crypto">عملات رقمية</option>
        <option value="stocks">أسهم</option>
      </select>
      <input id="bt-symbol" value="BTCUSDT">
      <select id="bt-strategy">
        <option value="sma">تقاطع SMA</option>
        <option value="rsi">RSI انعكاسي</option>
      </select>
      <input id="bt-fast" type="number" value="20" min="2" style="width:70px" title="SMA سريعة">
      <input id="bt-slow" type="number" value="50" min="3" style="width:70px" title="SMA بطيئة">
      <input id="bt-capital" type="number" value="10000" style="width:100px" title="رأس المال">
      <button id="bt-run">تشغيل</button>
    </div>
    <div class="stats" id="bt-metrics"></div>
    <canvas id="equity" width="1000" height="320"></canvas>
    <div id="bt-trades"></div>
  </section>

  <section id="tab-screener" class="panel hidden">
    <div class="controls">
      <select id="sc-market">
        <option value="crypto">عملات رقمية</option>
        <option value="stocks">أسهم</option>
      </select>
      <label>RSI من <input id="sc-min-rsi" type="number" value="0" style="width:60px"></label>
      <label>إلى <input id="sc-max-rsi" type="number" value="100" style="width:60px"></label>
      <label>فوق SMA <input id="sc-above-sma" type="number" value="50" min="0" style="width:60px"></label>
      <button id="sc-run">فحص</button>
    </div>
    <div id="sc-results"></div>
  </section>
</main>

<footer>QuantDesk — بيانات من Binance / CoinGecko / Stooq · للاستخدام التعليمي فقط</footer>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
